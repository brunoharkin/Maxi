version: '3.8'

services:
  maxi-frontend:
    image: node:18-alpine
    container_name: maxi-frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_FIREBASE_API_KEY=${NEXT_PUBLIC_FIREBASE_API_KEY}
      - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID=${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.maxi.rule=Host(`maxi.ugaritdigital.com`)"
      - "traefik.http.routers.maxi.entrypoints=websecure"
      - "traefik.http.routers.maxi.tls.certresolver=le"
      - "traefik.http.services.maxi.loadbalancer.server.port=3000"
    networks:
      - proxy
      - maxi-internal
    command: sh -c "npm install && npm run build && npm start"

networks:
  proxy:
    external: true
  maxi-internal:
    driver: bridge
    internal: true

volumes:
  maxi_data: 